name: Current Ten 20261006 narrated audio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/current-ten-20261006-narrated-audio.yml'
      - 'media_jobs/current_ten_20261006_narrated.json'
      - 'tools/render_current_ten_20261006_audio.py'
      - 'tools/qa_current_ten_20261006_asr.py'
      - 'tools/save_current_ten_20261006_audio.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: current-ten-20261006-narrated-audio
  cancel-in-progress: true
jobs:
  audio:
    # Held during the forty-unique-video migration: no Azure calls.
    # Config enabled=true alone must not revive a dated or superseded job.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install established Azure audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --disable-pip-version-check --no-input pillow requests azure-cognitiveservices-speech
      - name: Synthesize four approved scripts with Nestoras
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          set -euo pipefail
          python3 tools/render_current_ten_20261006_audio.py --manifest media_jobs/current_ten_20261006_narrated.json --output "$RUNNER_TEMP/narrated-audio"
      - name: Preserve downloadable audio before any further processing
        uses: actions/upload-artifact@v4
        with:
          name: current-ten-20261006-narrated-audio
          path: ${{ runner.temp }}/narrated-audio/
          retention-days: 3
      - name: Recognize exact WAVs independently without script hints
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          python3 tools/qa_current_ten_20261006_asr.py --manifest media_jobs/current_ten_20261006_narrated.json --source "$RUNNER_TEMP/narrated-audio" --output "$RUNNER_TEMP/asr-results"
      - name: Preserve recognition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-ten-20261006-independent-asr
          path: ${{ runner.temp }}/asr-results/
          retention-days: 3
      - name: Save only batch files through GitHub Git Data API
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/save_current_ten_20261006_audio.py --audio "$RUNNER_TEMP/narrated-audio" --asr "$RUNNER_TEMP/asr-results"
