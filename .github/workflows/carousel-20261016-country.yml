name: Greece Germany comparison review 20261016
on:
  push:
    branches: [main]
    paths: ['.github/workflows/carousel-20261016-country.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: carousel-20261016-country
  cancel-in-progress: false
jobs:
  render:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            production/carousel_20261016
            media/carousel_20261016/country_sources
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install Pillow==11.3.0
      - run: python production/carousel_20261016/build_country.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greece-germany-20261016-exact-review
          path: media/carousel_20261016/greece_germany
          retention-days: 2
      - run: |
          git config user.name 'carousel-media-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add --sparse -f media/carousel_20261016/greece_germany
          git commit -m 'Store Greece Germany comparison candidate; final visual QA required'
          git pull --rebase origin main
          git push origin HEAD:main
