name: Export Milky Seas source material
on:
  push:
    paths: ['.github/workflows/milky-review-audio-20260927.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch open licensed research figures
        run: |
          mkdir sources
          curl --fail --location --retry 2 'https://repository.library.noaa.gov/view/noaa/54100/noaa_54100_DS1.pdf' -o sources/milky-seas-paper.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: milky-research-source
          path: sources/
          retention-days: 3
