name: MESSAGE SERIES EP15 20260927

on:
  push:
    branches: [main]
    paths:
      - 'media_jobs/message_series_20260927_ep15.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: message-series-ep15-zero-cost
  cancel-in-progress: false

jobs:
  render-ep15:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out approved job
        uses: actions/checkout@v4
      - name: Install deterministic media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil fonts-dejavu-core
      - name: Render Episode 15
        env:
          OUTPUT_DIR: ${{ runner.temp }}/finished
        run: |
          /usr/bin/python3 tools/render_carousel_pack_robust.py --manifest media_jobs/message_series_20260927_ep15.json --output "$OUTPUT_DIR"
      - name: Store Episode 15 publishing assets
        env:
          OUTPUT_DIR: ${{ runner.temp }}/finished
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/media-output-repo"
          if git fetch origin media-output --depth=1; then
            git worktree add --detach "$OUT" FETCH_HEAD
          else
            git worktree add --detach "$OUT" "$GITHUB_SHA"
            git -C "$OUT" checkout --orphan media-output
            git -C "$OUT" rm -rf .
          fi
          SRC="$(find "$OUTPUT_DIR" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$SRC"
          mkdir -p "$OUT/jobs/message-series-20260927-ep15"
          rm -rf "$OUT/jobs/message-series-20260927-ep15"/*
          cp -a "$SRC"/. "$OUT/jobs/message-series-20260927-ep15/"\n          for f in "$OUT"/jobs/message-series-20260927-ep15/*.jpg; do base64 -w 0 "$f" > "$f.b64"; done
          git -C "$OUT" config user.name 'github-actions[bot]'
          git -C "$OUT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$OUT" add jobs/message-series-20260927-ep15
          if ! git -C "$OUT" diff --cached --quiet; then
            git -C "$OUT" commit -m 'Render message-series Episode 15'
            git -C "$OUT" push origin HEAD:media-output
          fi
