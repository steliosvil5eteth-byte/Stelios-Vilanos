name: Piper Greek PR Voice Demo

on:
  pull_request:
    branches: [main]
    paths:
      - 'voice_demo/**'

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.number == 7
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Piper and media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install "piper-tts==1.5.0"

      - name: Download Greek Piper voice
        run: |
          python -m piper.download_voices el_GR-rapunzelina-medium

      - name: Synthesize and normalize
        run: |
          set -euo pipefail
          mkdir -p voice_demo/output
          piper --model el_GR-rapunzelina-medium.onnx --sentence-silence 0.30 --output_file voice_demo/output/raw.wav < voice_demo/demo.txt
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 voice_demo/output/raw.wav)
          RATIO=$(python -c 'import sys; d=float(sys.argv[1]); print(max(0.75,min(1.35,d/120.0)))' "$DUR")
          ffmpeg -y -v error -i voice_demo/output/raw.wav -filter:a "atempo=${RATIO},loudnorm=I=-16:LRA=7:TP=-1.5" -ar 48000 -ac 2 voice_demo/output/voice.wav
          FINAL=$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 voice_demo/output/voice.wav)
          printf 'raw_duration=%s\nfinal_duration=%s\natempo=%s\n' "$DUR" "$FINAL" "$RATIO" > voice_demo/output/duration.txt

      - name: Build mobile preview video
        run: |
          set -euo pipefail
          FINAL=$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 voice_demo/output/voice.wav)
          ffmpeg -y -v error -f lavfi -i "color=c=0x101820:s=1080x1920:r=25:d=${FINAL}" -i voice_demo/output/voice.wav -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ΔΩΡΕΑΝ ΕΛΛΗΝΙΚΗ ΦΩΝΗ':fontcolor=white:fontsize=64:x=(w-text_w)/2:y=700,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Piper • rapunzelina • mobile test':fontcolor=white:fontsize=38:x=(w-text_w)/2:y=800" -map 0:v -map 1:a -shortest -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart voice_demo/output/free-greek-voice-demo.mp4
          ffmpeg -v error -i voice_demo/output/free-greek-voice-demo.mp4 -f null -

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-greek-piper-pr7
          path: |
            voice_demo/output/free-greek-voice-demo.mp4
            voice_demo/output/voice.wav
            voice_demo/output/duration.txt
          retention-days: 7
