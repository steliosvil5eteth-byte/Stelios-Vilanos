name: CURRENT TEN 20261003 Carousels

on:
  push:
    branches: [main]
    paths:
      - 'media_jobs/current_ten_20261003_carousels.json'
      - '.github/workflows/current-ten-20261003-carousels.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-ten-20261003-carousels
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil fonts-dejavu-core
      - name: Render exact carousel assets
        env:
          OUTPUT_DIR: ${{ runner.temp }}/finished
        run: |
          /usr/bin/python3 tools/render_carousel_pack_robust.py --manifest media_jobs/current_ten_20261003_carousels.json --output "$OUTPUT_DIR"
      - name: Publish rendered assets to media-output
        env:
          OUTPUT_DIR: ${{ runner.temp }}/finished
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/media-output-repo"
          if git fetch origin media-output --depth=1; then
            git worktree add --detach "$OUT" FETCH_HEAD
          else
            git worktree add --detach "$OUT" "$GITHUB_SHA"
            git -C "$OUT" checkout --orphan media-output
            git -C "$OUT" rm -rf .
          fi
          mkdir -p "$OUT/jobs/current-ten-20261003-carousels"
          cp -a "$OUTPUT_DIR"/. "$OUT/jobs/current-ten-20261003-carousels/"
          git -C "$OUT" config user.name 'github-actions[bot]'
          git -C "$OUT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$OUT" add jobs/current-ten-20261003-carousels
          if ! git -C "$OUT" diff --cached --quiet; then
            git -C "$OUT" commit -m "Render CURRENT_TEN 2026-10-03 carousels"
            git -C "$OUT" push origin HEAD:media-output
          fi
