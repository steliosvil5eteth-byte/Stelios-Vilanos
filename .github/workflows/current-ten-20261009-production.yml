name: Current Ten 20261009 production and technical QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/current-ten-20261009-production.yml'
      - 'tools/render_current_ten_20261009.py'
      - 'production_20261009/manifest.json'
      - 'production_20261009/sources/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: current-ten-20261009-production
  cancel-in-progress: false
jobs:
  production:
    # Archived shared production; new program activation must not revive it.
    # Keep this job disabled even when its historical manifest is withdrawn.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m pip install --disable-pip-version-check --no-input pillow requests azure-cognitiveservices-speech
      - name: Render exact-final media and technical QA
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          set -euo pipefail
          python3 tools/render_current_ten_20261009.py --manifest production_20261009/manifest.json --output production_20261009/final
      - name: Preserve render output
        uses: actions/upload-artifact@v4
        with:
          name: current-ten-20261009-exact-final
          path: |
            production_20261009/final/
            production_20261009/qa/
            production_20261009/delivery_journal.json
          retention-days: 5
          if-no-files-found: error
      - name: Commit exact-final media for scheduling readback
        run: |
          set -euo pipefail
          git config user.name 'social-production-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add production_20261009/final production_20261009/qa production_20261009/delivery_journal.json
          git commit -m 'Render 2026-10-09 CURRENT_TEN exact-final candidates'
          git push
