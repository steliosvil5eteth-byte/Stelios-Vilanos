name: Volcanic lightning preview v2 - Nestoras photos

on:
  push:
    branches: [main]
    paths:
      - 'media_jobs/volcanic_lightning_preview_v2.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: volcanic-lightning-preview-v2
  cancel-in-progress: false

jobs:
  render:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify preview-only settings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('media_jobs/volcanic_lightning_preview_v2.json').read_text(encoding='utf-8'))
          assert m['approved'] is True
          assert m['preview_only'] is True
          assert m['publish_to_social'] is False
          assert m['voice'] == 'el-GR-NestorasNeural'
          assert m['min_duration_seconds'] >= 80
          print('Preview-only settings verified.')
          PY

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil fonts-dejavu-core

      - name: Fetch existing volcanic visual assets
        run: |
          git fetch origin media-output --depth=1

      - name: Render Nestoras final review preview
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          OUTPUT_DIR: ${{ runner.temp }}/volcanic-preview
        run: |
          set -euo pipefail
          python3 tools/render_volcanic_nestoras_existing_assets.py \
            --manifest media_jobs/volcanic_lightning_preview_v2.json \
            --output "$OUTPUT_DIR"

      - name: Publish preview to media-output branch
        env:
          OUTPUT_DIR: ${{ runner.temp }}/volcanic-preview
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/media-output-repo"
          git worktree add --detach "$OUT" origin/media-output
          DEST="$OUT/jobs/volcanic-lightning-nestoras-final-preview"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$OUTPUT_DIR/preview"/. "$DEST"/
          git -C "$OUT" config user.name 'github-actions[bot]'
          git -C "$OUT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$OUT" add jobs/volcanic-lightning-nestoras-final-preview
          if ! git -C "$OUT" diff --cached --quiet; then
            git -C "$OUT" commit -m "Render final Nestoras volcanic lightning review preview"
            git -C "$OUT" push origin HEAD:media-output
          fi
          cat "$OUTPUT_DIR/preview/qa.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview only. Nothing was published to social platforms." >> "$GITHUB_STEP_SUMMARY"
