name: Verify Hawthorne narration 20260929

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-hawthorne-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact repaired media
        run: |
          git fetch origin media-output --depth=1
          git worktree add "$RUNNER_TEMP/media-output" FETCH_HEAD
          cp "$RUNNER_TEMP/media-output/jobs/current-ten-20260929-repaired-videos/current-ten-20260929-hawthorne-repair/nestoras.wav" hawthorne-nestoras.wav
          cp "$RUNNER_TEMP/media-output/jobs/current-ten-20260929-repaired-videos/current-ten-20260929-hawthorne-repair/current-ten-20260929-hawthorne-repair.mp4" hawthorne-final.mp4
          sha256sum hawthorne-nestoras.wav hawthorne-final.mp4 > sha256.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent ASR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --disable-pip-version-check openai-whisper
      - name: Transcribe exact Nestoras audio independently
        run: |
          python - <<'PY'
          import whisper, json
          m=whisper.load_model('small')
          r=m.transcribe('hawthorne-nestoras.wav',language='el',fp16=False)
          rows=[{'start':s['start'],'end':s['end'],'text':s['text'].strip()} for s in r['segments']]
          open('hawthorne-whisper-transcript.json','w',encoding='utf-8').write(json.dumps(rows,ensure_ascii=False,indent=2))
          print(json.dumps(rows,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hawthorne-audio-verification
          path: |
            hawthorne-whisper-transcript.json
            sha256.txt
          retention-days: 3
