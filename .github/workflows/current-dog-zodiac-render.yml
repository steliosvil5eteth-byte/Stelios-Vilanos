name: CURRENT final dog + zodiac render

on:
  push:
    branches: [main]
    paths:
      - 'media_jobs/current_dog_zodiac_final.json'
      - '.github/workflows/current-dog-zodiac-render.yml'
      - 'tools/render_carousel_pack.py'
      - 'tools/render_carousel_pack_robust.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-dog-zodiac-final
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil fonts-dejavu-core
      - name: Render final dog and zodiac packs
        env:
          OUTPUT_DIR: ${{ runner.temp }}/finished
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            rm -rf "$OUTPUT_DIR"
            mkdir -p "$OUTPUT_DIR"
            if /usr/bin/python3 tools/render_carousel_pack_robust.py --manifest media_jobs/current_dog_zodiac_final.json --output "$OUTPUT_DIR"; then
              ok=1
              break
            fi
            echo "Render attempt $attempt hit an upstream media error; waiting before retry."
            sleep $((attempt * 35))
          done
          test "$ok" -eq 1
      - name: Store finished publishing assets
        env:
          OUTPUT_DIR: ${{ runner.temp }}/finished
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/media-output-repo"
          if git fetch origin media-output --depth=1; then
            git worktree add --detach "$OUT" FETCH_HEAD
          else
            git worktree add --detach "$OUT" "$GITHUB_SHA"
            git -C "$OUT" checkout --orphan media-output
            git -C "$OUT" rm -rf .
          fi
          mkdir -p "$OUT/jobs"
          cp -a "$OUTPUT_DIR"/. "$OUT/jobs/"
          git -C "$OUT" config user.name 'github-actions[bot]'
          git -C "$OUT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$OUT" add jobs
          if ! git -C "$OUT" diff --cached --quiet; then
            git -C "$OUT" commit -m 'Render final dog and zodiac packs'
            git -C "$OUT" push origin HEAD:media-output
          fi
