name: Build 2026-10-11 social media

on:
  push:
    branches: [main]
    paths:
      - "production/cloud_media_20261011/**"
      - ".github/workflows/cloud_media_20261011.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install pillow requests
      - name: Build 15 vertical videos and QA sheets
        run: python production/cloud_media_20261011/build.py
      - name: Validate outputs
        run: |
          test "$(find generated/2026-10-11 -maxdepth 1 -name 'story_*.mp4' | wc -l)" -eq 15
          test -s generated/2026-10-11/qa_overview.jpg
          test -s generated/2026-10-11/delivery_manifest.json
      - name: Commit generated media
        run: |
          git config user.name "social-media-automation"
          git config user.email "actions@users.noreply.github.com"
          git add generated/2026-10-11
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build 15 social videos for 2026-10-11"
            git push origin HEAD:main
          fi
