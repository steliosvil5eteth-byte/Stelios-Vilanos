name: CURRENT narrated features - Piper local Greek

on:
  push:
    branches: [main]
    paths:
      - 'media_jobs/narrated_feature_current.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-narrated-features
  cancel-in-progress: false

jobs:
  render:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out approved current workflow
        uses: actions/checkout@v4

      - name: Verify current free-local policy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('media_jobs/narrated_feature_current.json').read_text(encoding='utf-8'))
          assert manifest['approved'] is True
          assert manifest['paid_generation_allowed'] is False
          for job in manifest['jobs']:
              assert job['voice'] == 'el_GR-rapunzelina-medium'
              assert job['slot'] in {'17:00','23:00'}
          print('Current policy verified: local Piper only; no paid fallback.')
          PY

      - name: Install deterministic media tools and Piper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil fonts-dejavu-core curl
          python3 -m pip install --disable-pip-version-check --no-input piper-tts
          command -v piper

      - name: Download pinned Greek Piper voice
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/piper"
          BASE='https://huggingface.co/rhasspy/piper-voices/resolve/main/el/el_GR/rapunzelina/medium'
          curl -L --fail --retry 3 "$BASE/el_GR-rapunzelina-medium.onnx" -o "$RUNNER_TEMP/piper/el_GR-rapunzelina-medium.onnx"
          curl -L --fail --retry 3 "$BASE/el_GR-rapunzelina-medium.onnx.json" -o "$RUNNER_TEMP/piper/el_GR-rapunzelina-medium.onnx.json"
          test -s "$RUNNER_TEMP/piper/el_GR-rapunzelina-medium.onnx"
          test -s "$RUNNER_TEMP/piper/el_GR-rapunzelina-medium.onnx.json"

      - name: Render strict Piper features
        env:
          PIPER_MODEL: ${{ runner.temp }}/piper/el_GR-rapunzelina-medium.onnx
          OUTPUT_DIR: ${{ runner.temp }}/finished
        run: |
          set -euo pipefail
          python3 tools/render_narrated_feature_piper.py \
            --manifest media_jobs/narrated_feature_current.json \
            --output "$OUTPUT_DIR"

      - name: Publish only QA-passed media to media-output branch
        env:
          OUTPUT_DIR: ${{ runner.temp }}/finished
        run: |
          set -euo pipefail
          BATCH=$(sha256sum media_jobs/narrated_feature_current.json | cut -c1-16)
          OUT="$RUNNER_TEMP/media-output-repo"
          if git fetch origin media-output --depth=1; then
            git worktree add --detach "$OUT" FETCH_HEAD
          else
            git worktree add --detach "$OUT" "$GITHUB_SHA"
            git -C "$OUT" checkout --orphan media-output
            git -C "$OUT" rm -rf .
          fi
          mkdir -p "$OUT/jobs/$BATCH"
          cp -a "$OUTPUT_DIR"/. "$OUT/jobs/$BATCH/"
          git -C "$OUT" config user.name 'github-actions[bot]'
          git -C "$OUT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$OUT" add jobs
          if ! git -C "$OUT" diff --cached --quiet; then
            git -C "$OUT" commit -m "Render QA-passed Piper features $BATCH"
            git -C "$OUT" push origin HEAD:media-output
          fi
          echo "batch=$BATCH" >> "$GITHUB_STEP_SUMMARY"
          cat "$OUTPUT_DIR/qa-summary.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Free local Piper voice, no background music, avatar, paid fallback or social publishing was used." >> "$GITHUB_STEP_SUMMARY"
