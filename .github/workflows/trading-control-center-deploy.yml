name: Trading Control Center Deploy
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-control-center/v1.4
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate required Vercel secrets
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID"; exit 1; }
      - name: Install project dependencies
        run: npm install --ignore-scripts
      - name: Validate Trading Control Center
        run: npm run validate
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@48.8.0
      - name: Pull Vercel project configuration
        run: vercel pull --yes --environment=${{ inputs.target == 'production' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build ${{ inputs.target == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN"
      - name: Deploy
        run: vercel deploy --prebuilt ${{ inputs.target == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN"
