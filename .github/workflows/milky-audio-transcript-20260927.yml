name: Verify existing Greek narration
on:
  push:
    paths: ['.github/workflows/milky-audio-transcript-20260927.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media-output
          sparse-checkout: jobs/features-20260927/phenom-milky-seas-20260927-1700
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install faster-whisper==1.2.0 requests
      - name: Independently transcribe existing audio
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          import json
          model=WhisperModel("small",device="cpu",compute_type="int8",cpu_threads=4)
          segments,info=model.transcribe("jobs/features-20260927/phenom-milky-seas-20260927-1700/nestoras.wav",language="el",beam_size=5,word_timestamps=True)
          data=[{"start":s.start,"end":s.end,"text":s.text,"words":[{"word":w.word,"start":w.start,"end":w.end} for w in (s.words or [])]} for s in segments]
          with open("transcript.json","w") as f: json.dump(data,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: milky-independent-transcript
          path: transcript.json
          retention-days: 3
