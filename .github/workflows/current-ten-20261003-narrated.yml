name: CURRENT TEN 20261003 Azure Nestoras

on:
  push:
    branches: [main]
    paths:
      - 'media_jobs/current_ten_20261003_narrated.json'
      - '.github/workflows/current-ten-20261003-narrated.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-ten-20261003-narrated
  cancel-in-progress: false

jobs:
  render:
    # Held during the forty-unique-video migration: no Azure calls.
    # Config enabled=true alone must not revive a dated or superseded job.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest policy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('media_jobs/current_ten_20261003_narrated.json').read_text())
          assert m['approved'] is True
          assert m['paid_generation_allowed'] is False
          assert len(m['jobs']) == 4
          for j in m['jobs']:
              assert j['local_date']=='2026-10-03'
              assert j['slot'] in {'13:00','17:00','18:30','22:00'}
              assert j['voice']=='el-GR-NestorasNeural'
              assert j['background_music'] is False
          print('manifest policy OK')
          PY
      - name: Install media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m pip install --disable-pip-version-check --no-input pillow requests azure-cognitiveservices-speech
      - name: Render narrated final media
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          python3 tools/render_azure_feature_batch.py --manifest media_jobs/current_ten_20261003_narrated.json --output "$RUNNER_TEMP/finished"
      - name: Publish QA outputs to media-output
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/media-output-repo"
          if git fetch origin media-output --depth=1; then
            git worktree add --detach "$OUT" FETCH_HEAD
          else
            git worktree add --detach "$OUT" "$GITHUB_SHA"
            git -C "$OUT" checkout --orphan media-output
            git -C "$OUT" rm -rf .
          fi
          mkdir -p "$OUT/jobs/current-ten-20261003-narrated"
          cp -a "$RUNNER_TEMP/finished"/. "$OUT/jobs/current-ten-20261003-narrated/"
          git -C "$OUT" config user.name 'github-actions[bot]'
          git -C "$OUT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$OUT" add jobs/current-ten-20261003-narrated
          if ! git -C "$OUT" diff --cached --quiet; then
            git -C "$OUT" commit -m "Render CURRENT_TEN 2026-10-03 narrated media"
            git -C "$OUT" push origin HEAD:media-output
          fi
