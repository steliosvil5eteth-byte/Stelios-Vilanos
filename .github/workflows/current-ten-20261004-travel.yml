name: Current Ten 20261004 travel Nymfaio repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/current-ten-20261004-travel.yml'
      - 'media_jobs/assets/current-ten-20261004-travel-nymfaio/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: current-ten-20261004-travel
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m pip install --disable-pip-version-check --no-input pillow requests azure-cognitiveservices-speech
      - name: Render Nestoras exact final from reviewed scene sources
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import render_azure_feature_batch as r
          src=json.loads(Path('media_jobs/current_ten_20261004_narrated_all.json').read_text(encoding='utf-8'))
          job=next(j for j in src['jobs'] if j['id']=='current-ten-20261004-travel-nymfaio')
          if 'Εικόνες δημιουργημένες με ΤΝ.' not in job['caption']:
              job['caption']=job['caption'].replace('\n\nΑν σας άρεσε', '\n\nΕικόνες δημιουργημένες με ΤΝ.\n\nΑν σας άρεσε')
          root=Path(os.environ['RUNNER_TEMP'])/'final'/job['id']
          photos=root/'photos'
          photos.mkdir(parents=True,exist_ok=True)
          assets=sorted(Path('media_jobs/assets/current-ten-20261004-travel-nymfaio').glob('*.jpg'))
          if len(assets)!=8:
              raise SystemExit(f'need exactly 8 reviewed scene sources, found {len(assets)}')
          hashes=[hashlib.sha256(p.read_bytes()).hexdigest() for p in assets]
          if len(set(hashes))!=8:
              raise SystemExit('duplicate scene source')
          for i,p in enumerate(assets,1):
              shutil.copy2(p,photos/f'{i:02d}.jpg')
          records=[{'file':p.name,'source':'OpenAI built-in image generation','visual_kind':'photorealistic generated scene','ai_generated':True,'sha256':h} for p,h in zip(assets,hashes)]
          (root/'visual-attribution.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'final-caption.txt').write_text(job['caption'],encoding='utf-8')
          wav,bounds,dur=r.synthesize(job['script'],root,job.get('min_duration_seconds'),job.get('max_duration_seconds'))
          (root/'speech-meta.json').write_text(json.dumps({'voice':r.VOICE,'duration_seconds':round(dur,3),'duration_min_seconds':job.get('min_duration_seconds'),'duration_max_seconds':job.get('max_duration_seconds'),'background_music':False,'word_boundaries':len(bounds)},ensure_ascii=False,indent=2),encoding='utf-8')
          srt=root/'subs.srt'
          cap_count=r.subtitles(bounds,dur,srt)
          raw=srt.read_text(encoding='utf-8')
          fixed=[]
          for block in raw.strip().split('\n\n'):
              lines=block.splitlines()
              if len(lines) >= 3:
                  txt=' '.join(lines[2:])
                  txt=re.sub(r'\s+([,.;:!?·])', r'\1', txt)
                  words=txt.split()
                  rows=[]; row=''
                  for word in words:
                      if not row or len(row)+1+len(word) <= 30:
                          row=word if not row else row+' '+word
                      else:
                          rows.append(row); row=word
                  if row: rows.append(row)
                  lines=lines[:2]+rows
              fixed.append('\n'.join(lines))
          srt.write_text('\n\n'.join(fixed)+'\n',encoding='utf-8')
          if re.search(r'\s+[,.;:!?·]', srt.read_text(encoding='utf-8')):
              raise SystemExit('subtitle punctuation-spacing normalization failed')
          video=root/(job['id']+'.mp4')
          r.make_video(job,photos,wav,srt,dur,video)
          result=r.qa(job,video,dur,len(records),cap_count)
          result.update({'generated_visuals':True,'eight_distinct_scene_sources':True,'caption_ai_disclosure':True,'release_gate':'PENDING_DIRECT_VISUAL_AUDIO_REVIEW'})
          (root/'qa.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Exact-final contact sheet and release gate
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          from PIL import Image,ImageOps
          root=Path('/home/runner/work/_temp/final/current-ten-20261004-travel-nymfaio')
          video=root/'current-ten-20261004-travel-nymfaio.mp4'
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(video)],text=True))
          dur=float(meta['format']['duration'])
          if not (80 <= dur <= 180): raise SystemExit(f'duration failed: {dur}')
          frames=[]
          for i,x in enumerate((.06,.18,.30,.42,.56,.69,.82,.94),1):
              p=root/f'qa-frame-{i:02d}.jpg'
              subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{dur*x:.3f}','-i',str(video),'-frames:v','1','-q:v','2',str(p)],check=True)
              frames.append(p)
          cw,ch=270,480
          canvas=Image.new('RGB',(cw*4,ch*2),(20,20,20))
          for i,p in enumerate(frames):
              with Image.open(p).convert('RGB') as im:
                  canvas.paste(ImageOps.fit(im,(cw,ch),method=Image.Resampling.LANCZOS),((i%4)*cw,(i//4)*ch))
          canvas.save(root/'final-contact-sheet.jpg',quality=94)
          (root/'release-gate.txt').write_text('PENDING_DIRECT_VISUAL_AUDIO_REVIEW\n',encoding='utf-8')
          PY
      - name: Save QA output to media-output
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          git fetch origin media-output --depth=1
          git worktree add -b cten1004travel "$OUT" FETCH_HEAD
          DEST="$OUT/jobs/current-ten-20261004-travel-nymfaio"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$RUNNER_TEMP/final/current-ten-20261004-travel-nymfaio"/. "$DEST"/
          git -C "$OUT" config user.name 'github-actions[bot]'
          git -C "$OUT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$OUT" add jobs/current-ten-20261004-travel-nymfaio
          git -C "$OUT" commit -m 'Render 04 Oct Nymfaio travel catch-up'
          git -C "$OUT" fetch origin media-output
          git -C "$OUT" rebase FETCH_HEAD
          git -C "$OUT" push origin HEAD:media-output
      - uses: actions/upload-artifact@v4
        with:
          name: current-ten-20261004-travel-nymfaio
          path: /home/runner/work/_temp/final/current-ten-20261004-travel-nymfaio/
          retention-days: 3
