name: Current Ten 20261001 exact-final render

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/current-ten-20261001-render.yml'
      - 'media_jobs/current_ten_20261001_carousels.json'
      - 'media_jobs/current_ten_20261001_dog_bartender.json'
      - 'media_jobs/current_ten_20261001_narrated_travel.json'
      - 'media_jobs/current_ten_20261001_narrated_phenomenon.json'
      - 'media_jobs/current_ten_20261001_narrated_experiment.json'
      - 'media_jobs/current_ten_20261001_narrated_legend.json'
      - 'tools/render_carousel_pack.py'
      - 'tools/render_azure_feature_batch.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-ten-20261001-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core python3-pil
          python3 -m pip install --disable-pip-version-check --no-input pillow requests azure-cognitiveservices-speech

      - name: Render six carousel jobs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/final/carousels-main" "$RUNNER_TEMP/final/carousels-dog"
          python3 tools/render_carousel_pack.py \
            --manifest media_jobs/current_ten_20261001_carousels.json \
            --output "$RUNNER_TEMP/final/carousels-main"
          python3 tools/render_carousel_pack.py \
            --manifest media_jobs/current_ten_20261001_dog_bartender.json \
            --output "$RUNNER_TEMP/final/carousels-dog"

      - name: Render four narrated jobs with exact Nestoras voice
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          set -euo pipefail
          for pair in \
            "travel:media_jobs/current_ten_20261001_narrated_travel.json" \
            "phenomenon:media_jobs/current_ten_20261001_narrated_phenomenon.json" \
            "experiment:media_jobs/current_ten_20261001_narrated_experiment.json" \
            "legend:media_jobs/current_ten_20261001_narrated_legend.json"
          do
            name="${pair%%:*}"
            manifest="${pair#*:}"
            mkdir -p "$RUNNER_TEMP/final/narrated/$name"
            python3 tools/render_azure_feature_batch.py \
              --manifest "$manifest" \
              --output "$RUNNER_TEMP/final/narrated/$name"
          done

      - name: Build direct-review contact sheets from exact final files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, subprocess
          from pathlib import Path
          from PIL import Image, ImageOps
          root=Path('/home/runner/work/_temp/final')
          # Carousels: contact sheet for exact jpg cards and exact vertical slideshow.
          for section in ('carousels-main','carousels-dog'):
              sec=root/section
              for batch in [p for p in sec.iterdir() if p.is_dir()]:
                  report=json.loads((batch/'manifest.json').read_text(encoding='utf-8'))
                  for job in report['jobs']:
                      if job.get('status')!='rendered':
                          raise SystemExit(f"carousel render failed: {job}")
                      jid=job['id']; n=int(job['card_count'])
                      cards=[batch/f'{jid}-{i:02}.jpg' for i in range(1,n+1)]
                      if not all(p.exists() for p in cards): raise SystemExit(f'missing cards for {jid}')
                      cell=360; cols=min(3,n); rows=math.ceil(n/cols)
                      canvas=Image.new('RGB',(cols*cell,rows*cell),(24,24,24))
                      for i,p in enumerate(cards):
                          with Image.open(p).convert('RGB') as im:
                              canvas.paste(ImageOps.fit(im,(cell,cell),method=Image.Resampling.LANCZOS),((i%cols)*cell,(i//cols)*cell))
                      canvas.save(batch/f'{jid}-cards-contact-sheet.jpg',quality=94)
                      video=batch/f'{jid}.mp4'
                      if not video.exists(): raise SystemExit(f'missing slideshow {jid}')
                      probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-of','json',str(video)]))
                      dur=float(probe['format']['duration'])
                      frames=[]
                      for k,x in enumerate([.08,.25,.42,.58,.75,.92],1):
                          p=batch/f'{jid}-yt-frame-{k:02}.jpg'
                          subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{dur*x:.3f}','-i',str(video),'-frames:v','1','-q:v','2',str(p)],check=True)
                          frames.append(p)
                      cw,ch=270,480; c=Image.new('RGB',(cw*3,ch*2),(24,24,24))
                      for i,p in enumerate(frames):
                          with Image.open(p).convert('RGB') as im:
                              c.paste(ImageOps.fit(im,(cw,ch),method=Image.Resampling.LANCZOS),((i%3)*cw,(i//3)*ch))
                      c.save(batch/f'{jid}-youtube-contact-sheet.jpg',quality=94)
                      (batch/f'{jid}-release-gate.txt').write_text('PENDING_DIRECT_VISUAL_REVIEW\n',encoding='utf-8')
          # Narrated: contact sheet from the exact final mp4. Technical qa.json is retained but does not equal final review.
          for kind in ('travel','phenomenon','experiment','legend'):
              base=root/'narrated'/kind
              for d in [p for p in base.iterdir() if p.is_dir()]:
                  video=d/(d.name+'.mp4')
                  if not video.exists(): raise SystemExit(f'missing narrated final {video}')
                  probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-of','json',str(video)]))
                  dur=float(probe['format']['duration'])
                  frames=[]
                  for k,x in enumerate([.05,.18,.32,.47,.62,.78,.94],1):
                      p=d/f'final-frame-{k:02}.jpg'
                      subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{dur*x:.3f}','-i',str(video),'-frames:v','1','-q:v','2',str(p)],check=True)
                      frames.append(p)
                  cw,ch=270,480; c=Image.new('RGB',(cw*4,ch*2),(24,24,24))
                  for i,p in enumerate(frames):
                      with Image.open(p).convert('RGB') as im:
                          c.paste(ImageOps.fit(im,(cw,ch),method=Image.Resampling.LANCZOS),((i%4)*cw,(i//4)*ch))
                  c.save(d/'final-contact-sheet.jpg',quality=94)
                  (d/'release-gate.txt').write_text('PENDING_DIRECT_VISUAL_REVIEW\n',encoding='utf-8')
          PY

      - name: Save exact finals and QA to media-output
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/media-output-repo"
          git fetch origin media-output --depth=1
          git worktree add -b current-ten-20261001-media "$OUT" FETCH_HEAD
          DEST="$OUT/jobs/current-ten-20261001"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$RUNNER_TEMP/final"/. "$DEST"/
          git -C "$OUT" config user.name 'github-actions[bot]'
          git -C "$OUT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$OUT" add jobs/current-ten-20261001
          if ! git -C "$OUT" diff --cached --quiet; then
            git -C "$OUT" commit -m 'Render 01 Oct CURRENT_TEN_DAILY exact finals for direct QA'
            git -C "$OUT" fetch origin media-output
            git -C "$OUT" rebase FETCH_HEAD
            git -C "$OUT" push origin HEAD:media-output
          fi
