name: One-off volcanic lightning replacement

on:
  push:
    branches: [main]
    paths:
      - 'media_jobs/volcanic_lightning_20260922.json'

permissions:
  contents: write

concurrency:
  group: volcanic-lightning-replacement-20260922
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify free-local replacement policy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('media_jobs/volcanic_lightning_20260922.json').read_text(encoding='utf-8'))
          assert m['approved'] is True
          assert m['paid_generation_allowed'] is False
          assert len(m['jobs']) == 1
          j=m['jobs'][0]
          assert j['voice'] == 'el_GR-rapunzelina-medium'
          assert j['category'] == 'phenomenon_video'
          assert j['visual_theme'] == 'volcanic_lightning'
          print('One-off policy verified: local Piper, original deterministic visuals, no paid fallback.')
          PY

      - name: Install deterministic media tools and Piper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil fonts-dejavu-core curl
          python3 -m pip install --disable-pip-version-check --no-input piper-tts
          command -v piper

      - name: Download pinned Greek Piper voice
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/piper"
          BASE='https://huggingface.co/rhasspy/piper-voices/resolve/main/el/el_GR/rapunzelina/medium'
          curl -L --fail --retry 3 "$BASE/el_GR-rapunzelina-medium.onnx" -o "$RUNNER_TEMP/piper/el_GR-rapunzelina-medium.onnx"
          curl -L --fail --retry 3 "$BASE/el_GR-rapunzelina-medium.onnx.json" -o "$RUNNER_TEMP/piper/el_GR-rapunzelina-medium.onnx.json"
          test -s "$RUNNER_TEMP/piper/el_GR-rapunzelina-medium.onnx"
          test -s "$RUNNER_TEMP/piper/el_GR-rapunzelina-medium.onnx.json"

      - name: Build rights-safe one-off renderer
        run: |
          cat > "$RUNNER_TEMP/render_volcanic.py" <<'PY'
          import hashlib, math, random, sys
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          sys.path.insert(0, str(Path.cwd()/'tools'))
          import render_narrated_feature_piper as piper
          base=piper.base
          old_make_scene=base.make_scene
          BW,BH=1200,2134
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          BOLD='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'

          def grad(d, top, bottom):
              for y in range(BH):
                  t=y/max(1,BH-1)
                  c=tuple(int(top[i]*(1-t)+bottom[i]*t) for i in range(3))
                  d.line((0,y,BW,y),fill=c)

          def tag(d,text):
              f=ImageFont.truetype(BOLD,31)
              box=d.textbbox((0,0),text,font=f)
              w=min(BW-120,box[2]-box[0]+52)
              d.rounded_rectangle((60,78,60+w,142),radius=18,fill=(0,0,0))
              d.text((84,90),text,font=f,fill='white')

          def bolt(d, pts, width=12):
              d.line(pts,fill=(245,245,255),width=width,joint='curve')
              d.line(pts,fill=(175,205,255),width=max(3,width//3),joint='curve')

          def make_scene(path,job,idx,total):
              if job.get('visual_theme')!='volcanic_lightning':
                  return old_make_scene(path,job,idx,total)
              seed=int(hashlib.sha256(f"{job['id']}:{idx}".encode()).hexdigest()[:12],16)
              rng=random.Random(seed)
              mode=idx%7
              img=Image.new('RGB',(BW,BH)); d=ImageDraw.Draw(img)
              grad(d,(18,22,36),(54,20,15))
              # volcano and glowing vent
              ground=1680
              d.polygon([(0,ground),(290,1510),(470,1300),(600,1230),(730,1310),(930,1520),(1200,ground),(1200,BH),(0,BH)],fill=(34,31,33))
              d.polygon([(520,1305),(600,1230),(680,1315),(640,1340),(595,1305),(555,1340)],fill=(128,51,24))
              d.ellipse((560,1270,640,1335),fill=(230,105,32))
              # ash plume formed from overlapping lobes
              height=380+int(720*((idx+1)/max(1,total)))
              cx=600+int(45*math.sin(idx*.7))
              for k in range(14):
                  yy=1240-int(k*height/14)
                  spread=95+k*22
                  x=cx+rng.randint(-spread//2,spread//2)
                  r=rng.randint(85,150)
                  shade=rng.randint(65,115)
                  d.ellipse((x-r,yy-r,x+r,yy+r),fill=(shade,shade-5,shade-8))
              # mode-specific scientific visual cues, all original drawings
              if mode in (0,1,4):
                  for b in range(2+(idx%3)):
                      x=390+rng.randint(0,430); y=470+rng.randint(0,500)
                      pts=[(x,y),(x+rng.randint(-70,70),y+130),(x+rng.randint(-120,120),y+245),(x+rng.randint(-80,80),y+390)]
                      bolt(d,pts,12 if b==0 else 8)
                  tag(d,'ΗΦΑΙΣΤΕΙΑΚΟΙ ΚΕΡΑΥΝΟΙ • ΠΡΑΓΜΑΤΙΚΟ ΦΑΙΝΟΜΕΝΟ')
              elif mode==2:
                  # collisions/fracturing near vent
                  for _ in range(38):
                      x=rng.randint(330,870); y=rng.randint(760,1280); r=rng.randint(7,22)
                      d.ellipse((x-r,y-r,x+r,y+r),fill=(165,132,104),outline=(225,185,120))
                  for _ in range(10):
                      x=rng.randint(420,780); y=rng.randint(820,1180)
                      d.text((x,y),rng.choice(['+','−']),font=ImageFont.truetype(BOLD,36),fill=(245,220,125))
                  tag(d,'ΣΥΓΚΡΟΥΣΕΙΣ ΣΩΜΑΤΙΔΙΩΝ • ΔΙΑΧΩΡΙΣΜΟΣ ΦΟΡΤΙΟΥ')
              elif mode==3:
                  # ice/water upper plume
                  for _ in range(24):
                      x=rng.randint(250,950); y=rng.randint(260,760)
                      d.line((x-18,y,x+18,y),fill=(205,230,245),width=4)
                      d.line((x,y-18,x,y+18),fill=(205,230,245),width=4)
                      d.ellipse((x-6,y-6,x+6,y+6),fill=(225,242,250))
                  bolt(d,[(720,350),(650,500),(710,620),(620,790)],10)
                  tag(d,'ΠΑΓΟΣ + ΥΠΕΡΨΥΓΜΕΝΟ ΝΕΡΟ • ΕΝΙΣΧΥΣΗ ΗΛΕΚΤΡΙΣΜΟΥ')
              elif mode==5:
                  # Hunga-style expanding lightning rings, schematic not a literal map
                  for rr in (150,260,370):
                      d.ellipse((600-rr,520-rr//2,600+rr,520+rr//2),outline=(170,205,255),width=9)
                  for ang in (-1.9,-1.25,-.55,.2,.9):
                      x=600+int(330*math.cos(ang)); y=520+int(150*math.sin(ang))
                      bolt(d,[(x,y),(x+rng.randint(-50,50),y+100),(x+rng.randint(-80,80),y+190)],7)
                  tag(d,'HUNGA 2022 • ΔΑΚΤΥΛΙΟΙ ΚΕΡΑΥΝΩΝ • ΣΧΗΜΑΤΙΚΗ ΑΠΕΙΚΟΝΙΣΗ')
              else:
                  # monitoring signals
                  d.rounded_rectangle((115,270,1085,850),radius=28,fill=(8,13,23),outline=(180,190,205),width=4)
                  pts=[]
                  for x in range(150,1040,35):
                      basey=700-int(250*(x-150)/890)
                      pts.append((x,basey+rng.randint(-55,55)))
                  d.line(pts,fill=(225,235,255),width=6)
                  for x,y in pts[::5]: d.ellipse((x-7,y-7,x+7,y+7),fill=(245,245,255))
                  tag(d,'ΚΕΡΑΥΝΟΙ ΩΣ ΣΗΜΑ ΠΑΡΑΚΟΛΟΥΘΗΣΗΣ ΕΚΡΗΞΕΩΝ')
              marker=job.get('visual_marker','')
              if marker:
                  f=ImageFont.truetype(FONT,25)
                  d.rounded_rectangle((45,BH-102,1155,BH-38),radius=18,fill=(0,0,0))
                  d.text((65,BH-88),marker,font=f,fill=(225,230,235))
              img.save(path,'JPEG',quality=92,subsampling=0)

          base.make_scene=make_scene
          if __name__=='__main__':
              base.main()
              out=piper.output_dir_from_argv()
              if out is not None:
                  piper.patch_qa_metadata(out/'qa-summary.json')
                  for qa in out.glob('*/qa.json'):
                      piper.patch_qa_metadata(qa)
          PY

      - name: Render and enforce strict QA
        env:
          PIPER_MODEL: ${{ runner.temp }}/piper/el_GR-rapunzelina-medium.onnx
          OUTPUT_DIR: ${{ runner.temp }}/finished
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/render_volcanic.py" \
            --manifest media_jobs/volcanic_lightning_20260922.json \
            --output "$OUTPUT_DIR"
          cat "$OUTPUT_DIR/qa-summary.json"

      - name: Publish only QA-passed output to media-output branch
        env:
          OUTPUT_DIR: ${{ runner.temp }}/finished
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/media-output-repo"
          if git fetch origin media-output --depth=1; then
            git worktree add --detach "$OUT" FETCH_HEAD
          else
            git worktree add --detach "$OUT" "$GITHUB_SHA"
            git -C "$OUT" checkout --orphan media-output
            git -C "$OUT" rm -rf .
          fi
          DEST="$OUT/jobs/volcanic-lightning-20260922"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$OUTPUT_DIR"/. "$DEST/"
          git -C "$OUT" config user.name 'github-actions[bot]'
          git -C "$OUT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$OUT" add jobs/volcanic-lightning-20260922
          git -C "$OUT" commit -m 'Render QA-passed volcanic lightning replacement'
          git -C "$OUT" push origin HEAD:media-output
          cat "$OUTPUT_DIR/qa-summary.json" >> "$GITHUB_STEP_SUMMARY"
          echo 'Original deterministic illustrations; local Piper; no background music; no paid fallback.' >> "$GITHUB_STEP_SUMMARY"
