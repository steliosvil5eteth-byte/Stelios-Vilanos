name: Compare current Hawthorne Metricool media 20260929

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compare-hawthorne-current-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Compare exact current Metricool file to reviewed repository master
        run: |
          set -euo pipefail
          curl -fL --retry 2 --connect-timeout 20 --max-time 150 -o current.mp4 "https://static.metricool.com/planner/202609/7000636-file-144302298478072654.mp4"
          curl -fL --retry 2 --connect-timeout 20 --max-time 150 -o master.mp4 "https://raw.githubusercontent.com/steliosvil5eteth-byte/Stelios-Vilanos/media-output/jobs/current-ten-20260929-repaired-videos/current-ten-20260929-hawthorne-repair/current-ten-20260929-hawthorne-repair.mp4"
          sha256sum current.mp4 master.mp4 | tee hashes.txt
          cmp current.mp4 master.mp4
          echo "IDENTICAL_BYTES=YES" >> hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hawthorne-current-byte-identity
          path: hashes.txt
          retention-days: 3
