name: Tomorrow carousel candidates 20261016
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/carousel-20261016-candidates.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: carousel-20261016-candidates
  cancel-in-progress: false
jobs:
  render-only:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            production/carousel_20261016
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install 'Pillow==11.3.0'
      - name: Apply tested end-timing and full-photo corrections
        run: python production/carousel_20261016/repair_and_render.py
      - name: Collect country data and licensed photo candidates only
        run: python production/carousel_20261016/collect_country_sources.py
      - name: Save exact review candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carousel-20261016-exact-candidates
          path: |
            media/carousel_20261016
            production/carousel_20261016
          retention-days: 2
          if-no-files-found: error
      - name: Store candidates without granting final review
        run: |
          git config user.name 'carousel-media-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add --sparse -f media/carousel_20261016
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store repaired Oct16 carousel candidates and research; final visual review required'
          git pull --rebase origin main
          git push origin HEAD:main
