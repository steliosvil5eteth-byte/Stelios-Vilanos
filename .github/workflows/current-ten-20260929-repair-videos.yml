      "caption": "Ο θρύλος λέει… Yuki-onna\\n\\nΗ ιστορία ακολουθεί την εκδοχή που δημοσίευσε ο Lafcadio Hearn στο Kwaidan το 1904. Λαογραφία — όχι αποδεδειγμένο υπερφυσικό γεγονός.\\n\\nΠηγή: Lafcadio Hearn, Kwaidan (1904) / Project Gutenberg.\\nΑν σας άρεσε, ακολουθήστε για περισσότερα.\\n#YukiOnna #ΙαπωνικήΛαογραφία #Θρύλοι #Ιαπωνία #ΠαράξενεςΙστορίες",
      "script": "Μέσα σε μια χιονοθύελλα, μια γυναίκα στα λευκά μπαίνει σε μια καλύβα — και ένας άντρας σώζεται μόνο επειδή υπόσχεται να μη μιλήσει ποτέ. Αυτός είναι ο θρύλος της Yuki-onna, της «γυναίκας του χιονιού» στην ιαπωνική λαογραφία. Δεν είναι αποδεδειγμένο υπερφυσικό γεγονός. Η ιστορία που ακολουθεί είναι συγκεκριμένα η εκδοχή που δημοσίευσε ο Lafcadio Hearn στο Kwaidan το 1904. Δύο ξυλοκόποι, ο ηλικιωμένος Mosaku και ο νεαρός Minokichi, αιφνιδιάζονται από χιονοθύελλα και βρίσκουν καταφύγιο σε μια μικρή καλύβα κοντά σε πορθμείο. Τη νύχτα, ο Minokichi ξυπνά και βλέπει μια γυναίκα ντυμένη στα λευκά. Στην αφήγηση, η παγωμένη ανάσα της σκοτώνει τον Mosaku. Τον ίδιο όμως τον λυπάται επειδή είναι νέος. Τον αφήνει να ζήσει με έναν όρο: να μην πει ποτέ σε κανέναν τι συνέβη. Τον επόμενο χειμώνα γνωρίζει μια νεαρή γυναίκα, την O-Yuki. Παντρεύονται, αποκτούν δέκα παιδιά και περνούν χρόνια μαζί. Εκείνη φαίνεται να μη γερνά. Ένα βράδυ, βλέποντάς την στο φως της λάμπας, ο Minokichi θυμάται τη χιονοθύελλα και σπάει την υπόσχεσή του. Η O-Yuki αποκαλύπτει ότι ήταν η γυναίκα εκείνης της νύχτας. Δεν τον σκοτώνει, επειδή τα παιδιά τους χρειάζονται πατέρα. Η ιστορία τελειώνει με την εξαφάνισή της. Ο ίδιος ο Hearn έγραψε ότι του διηγήθηκε αυτή την εκδοχή ένας αγρότης από το Chōfu της παλιάς επαρχίας Musashi. Η μορφή της Yuki-onna όμως υπήρχε ήδη σε παλαιότερη ιαπωνική παράδοση και εικονογραφία. Δεν υπάρχει μία μοναδική εκδοχή για όλη την Ιαπωνία. Κι αυτό είναι ίσως το πιο ενδιαφέρον: ο θρύλος δεν είναι μόνο τρόμος. Είναι ιστορία για μια υπόσχεση, μια οικογένεια και το τίμημα της αποκάλυψης. Αν σας άρεσε, ακολουθήστε για περισσότερα.",
