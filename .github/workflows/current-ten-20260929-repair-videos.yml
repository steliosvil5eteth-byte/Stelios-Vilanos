name: Current Ten 20260929 repair Hawthorne and Yuki

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/current-ten-20260929-repair-videos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: current-ten-20260929-repair-videos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m pip install --disable-pip-version-check --no-input pillow requests azure-cognitiveservices-speech
      - name: Write approved repair manifest
        run: |
          cat > "$RUNNER_TEMP/manifest.json" <<'JSON'
