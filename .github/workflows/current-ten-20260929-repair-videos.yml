      "caption": "Τα πειράματα Hawthorne — τι άλλαζε πραγματικά την παραγωγικότητα;\\n\\nΗ απλή φράση «οι άνθρωποι δουλεύουν καλύτερα επειδή τους παρακολουθούν» είναι υπεραπλούστευση.\\n\\nΠηγές: Harvard Business School Baker Library — Hawthorne Experiments.\\nΑν σας άρεσε, ακολουθήστε για περισσότερα.\\n#Hawthorne #Ψυχολογία #Πειράματα #Εργασία #Ιστορία",
      "script": "Μπορεί η παραγωγικότητα να αλλάξει απλώς επειδή οι εργαζόμενοι ξέρουν ότι κάποιος τους παρακολουθεί; Η γνωστή απάντηση λέγεται «Hawthorne effect», αλλά η πραγματική ιστορία είναι πολύ πιο σύνθετη. Στα Hawthorne Works της Western Electric, κοντά στο Σικάγο, έγιναν από το 1924 έως το 1933 μια σειρά από μελέτες για την εργασία και την παραγωγικότητα. Οι πρώτες δοκιμές, από το 1924 έως το 1927, εξέτασαν τον φωτισμό σε διαφορετικά τμήματα του εργοστασίου. Σύμφωνα με το ιστορικό αρχείο της Harvard Business School, οι μετρήσεις δεν έδειξαν καθαρή, σημαντική συσχέτιση ανάμεσα στο επίπεδο φωτισμού και την παραγωγικότητα. Αυτό οδήγησε τους ερευνητές να εξετάσουν άλλους παράγοντες. Από το 1927, οι μελέτες στο Relay Assembly Test Room παρακολουθούσαν μια μικρή ομάδα γυναικών που συναρμολογούσαν ηλεκτρομαγνητικούς διακόπτες. Δοκιμάστηκαν αλλαγές σε διαλείμματα, ώρες εργασίας και άλλες συνθήκες, ενώ η απόδοση καταγραφόταν συστηματικά. Η παραγωγικότητα συχνά αυξανόταν, αλλά οι ίδιοι οι ερευνητές δεν μπορούσαν να απομονώσουν μία μοναδική αιτία. Μπορεί να έπαιζαν ρόλο τα διαλείμματα, το ωράριο, τα κίνητρα, η μικρότερη ομάδα, η σχέση με τους ερευνητές ή ένας συνδυασμός όλων αυτών. Αργότερα, η ιστορία συμπυκνώθηκε στη δημοφιλή ιδέα ότι οι άνθρωποι αποδίδουν καλύτερα μόνο και μόνο επειδή γνωρίζουν ότι παρατηρούνται. Αυτό είναι υπεραπλούστευση. Τα Hawthorne studies είναι σημαντικά κυρίως επειδή έστρεψαν περισσότερη προσοχή στις κοινωνικές σχέσεις, στα κίνητρα και στην ανθρώπινη πλευρά της εργασίας. Και θυμίζουν κάτι βασικό για κάθε πείραμα: όταν αλλάζεις πολλά πράγματα μαζί, πρέπει να είσαι πολύ προσεκτικός πριν αποδώσεις το αποτέλεσμα σε έναν μόνο παράγοντα. Αν σας άρεσε, ακολουθήστε για περισσότερα.",
