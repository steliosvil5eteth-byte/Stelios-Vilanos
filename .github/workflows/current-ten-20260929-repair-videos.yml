      - name: Render exact final media
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          set -euo pipefail
          python3 tools/render_azure_feature_batch.py --manifest "$RUNNER_TEMP/manifest.json" --output "$RUNNER_TEMP/final"
      - name: Build contact sheets from the exact final MP4 files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, subprocess
          from pathlib import Path
          from PIL import Image, ImageOps
          root=Path('/home/runner/work/_temp/final')
          for d in root.iterdir():
              if not d.is_dir(): continue
              vids=list(d.glob('*.mp4'))
              if len(vids)!=1: raise SystemExit(f'expected one mp4 in {d}')
              video=vids[0]
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-of','json',str(video)]))
              dur=float(probe['format']['duration'])
              frames=[]
              for i,x in enumerate((.05,.18,.32,.47,.62,.78,.94),1):
                  p=d/f'qa-frame-{i:02}.jpg'
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',f'{dur*x:.3f}','-i',str(video),'-frames:v','1','-q:v','2',str(p)],check=True)
                  frames.append(p)
              cw,ch=270,480; canvas=Image.new('RGB',(cw*4,ch*2),(24,24,24))
              for i,p in enumerate(frames):
                  with Image.open(p).convert('RGB') as im:
                      canvas.paste(ImageOps.fit(im,(cw,ch),method=Image.Resampling.LANCZOS),((i%4)*cw,(i//4)*ch))
              canvas.save(d/'final-contact-sheet.jpg',quality=94)
              (d/'release-gate.txt').write_text('PENDING_DIRECT_VISUAL_REVIEW\n',encoding='utf-8')
          PY
      - name: Save repaired media and QA to media-output
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/media-output-repo"
          git fetch origin media-output --depth=1
          git worktree add -b current-ten-video-repair "$OUT" FETCH_HEAD
          DEST="$OUT/jobs/current-ten-20260929-repaired-videos"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$RUNNER_TEMP/final"/. "$DEST"/
          git -C "$OUT" config user.name 'github-actions[bot]'
          git -C "$OUT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$OUT" add jobs/current-ten-20260929-repaired-videos
          if ! git -C "$OUT" diff --cached --quiet; then
            git -C "$OUT" commit -m 'Repair 29 Sep Hawthorne and Yuki final videos'
            git -C "$OUT" fetch origin media-output
            git -C "$OUT" rebase FETCH_HEAD
            git -C "$OUT" push origin HEAD:media-output
          fi
