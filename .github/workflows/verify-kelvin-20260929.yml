name: Verify Kelvin narration
on:
  push:
    paths: ['.github/workflows/verify-kelvin-20260929.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: kelvin-audio-review
          path: audio-review
          run-id: 36316207398
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install requests faster-whisper==1.2.0
      - run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          import json
          m=WhisperModel('medium',device='cpu',compute_type='int8',cpu_threads=4)
          segs,info=m.transcribe('audio-review/nestoras.wav',language='el',beam_size=5)
          rows=[{'start':s.start,'end':s.end,'text':s.text} for s in segs]
          open('medium-transcript.json','w').write(json.dumps(rows,ensure_ascii=False,indent=2))
          print(json.dumps(rows,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kelvin-medium-transcript
          path: medium-transcript.json
          retention-days: 3
