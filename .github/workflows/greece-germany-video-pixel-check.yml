name: Germany exact lossless video review evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/greece-germany-video-pixel-check.yml']
permissions:
  contents: write
concurrency:
  group: greece-germany-video-pixel-check
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            state/daily_delivery
            media_qa
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: ''
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --no-cache-dir numpy==2.3.3 Pillow==11.3.0
      - name: Lossless exact MP4 visual evidence and complete timeline; no release
        run: |
          python - <<'PY'
          import pathlib,json,urllib.request,hashlib,subprocess,tempfile,datetime,traceback
          import numpy as np
          from PIL import Image
          root=pathlib.Path('state/daily_delivery');j=json.loads((root/'greece_germany_20261015.json').read_text());r=json.loads((root/'greece_germany_20261015_staging_receipt.json').read_text())
          assert datetime.datetime.now(datetime.timezone.utc)<datetime.datetime.fromisoformat(j['lease']['expires_at'])
          assert j['lease']['token']=='cf0080df-7787-48b4-bf2a-f41d0f7263b0'
          report={'package_id':'greece_germany','technical_only':True,'pass':False,'lossless_frames':[],'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'requires_actual_visual_inspection_of_new_pngs':True,'prior_reference_note':'Prior Google Slides-exported JPEGs changed pixels and cannot be byte-bound as exact source references. Fresh lossless PNGs must be inspected. Prior full-frame visual impression is not treated as exact clearance.'}
          tmp=pathlib.Path(tempfile.mkdtemp());dest=pathlib.Path('media_qa/greece_germany_20261015_lossless');dest.mkdir(exist_ok=True)
          try:
              v=tmp/'video.mp4'
              with urllib.request.urlopen(r['youtube']['media'],timeout=45) as response:b=response.read()
              v.write_bytes(b);h=hashlib.sha256(b).hexdigest();assert h==j['video_review']['sha256'],'StagedMP4hashmismatch'
              probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(v)]));vs=[s for s in probe['streams'] if s['codec_type']=='video'];assert len(vs)==1 and (vs[0]['width'],vs[0]['height'])==(1080,1920);assert vs[0]['r_frame_rate']=='24/1';assert not [s for s in probe['streams'] if s['codec_type']=='audio'];assert abs(float(probe['format']['duration'])-160)<0.1
              refs=[]
              for i in range(10):
                  f=dest/f'frame_{i+1:02d}.png';subprocess.run(['ffmpeg','-y','-v','error','-ss',str(i*16+8),'-i',str(v),'-frames:v','1',str(f)],check=True)
                  im=Image.open(f).convert('RGB');report['lossless_frames'].append({'card':i+1,'path':str(f),'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'rgb_sha256':hashlib.sha256(im.tobytes()).hexdigest(),'time_seconds':i*16+8})
                  b=subprocess.check_output(['ffmpeg','-v','error','-i',str(f),'-vf','scale=216:384','-pix_fmt','rgb24','-frames:v','1','-f','rawvideo','pipe:1']);refs.append(np.frombuffer(b,dtype=np.uint8).astype(np.int16))
              ef=open(tmp/'err','wb');p=subprocess.Popen(['ffmpeg','-v','error','-xerror','-i',str(v),'-vf','scale=216:384','-pix_fmt','rgb24','-f','rawvideo','pipe:1'],stdout=subprocess.PIPE,stderr=ef)
              n=0;sz=216*384*3;mx=[0.]*10;bad=[]
              while True:
                  b=p.stdout.read(sz)
                  if not b:break
                  assert len(b)==sz,f'Partialframe{n}'
                  ix=n//384;assert ix<10,f'Extraframe{n}'
                  err=float(np.abs(np.frombuffer(b,dtype=np.uint8).astype(np.int16)-refs[ix]).mean());mx[ix]=max(mx[ix],err)
                  if err>5:bad.append(n)
                  n+=1
              rc=p.wait();ef.close();assert rc==0,(tmp/'err').read_text();assert n==3840,f'Wrongframecount{n}'
              report['video']={'url':r['youtube']['media'],'sha256':h,'full_decode_error_free':True,'frame_count':n,'duration_seconds':160,'seconds_per_card':16,'max_mean_rgb_error_per_card':mx,'unexpected_frames':bad[:20],'audio_review':'NOT_APPLICABLE_NO_AUDIO_STREAM'}
              report['pass']=not bad
          except Exception as e:report['error']=repr(e);report['traceback']=traceback.format_exc()
          (dest/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n');print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Store QA evidence only, no scheduler or paid artifact storage
        run: |
          git config user.name 'exact-media-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add --sparse -f media_qa/greece_germany_20261015_lossless
          git commit -m 'Store exact lossless Germany MP4 frames and timeline evidence for actual review [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
