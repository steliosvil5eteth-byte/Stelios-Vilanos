name: Social Media Automation Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'queue/**'
      - 'src/**'
      - '.github/workflows/automation-dry-run.yml'

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate content plan
        run: python src/pipeline.py --plan config/content_plan.example.json

      - name: Validate automation queues
        run: python src/queue_validate.py
