name: Volcanic lightning Nestoras final preview

on:
  push:
    branches: [main]
    paths:
      - 'media_jobs/volcanic_lightning_final_preview.json'
      - 'tools/render_azure_feature_batch.py'
      - '.github/workflows/volcanic-lightning-nestoras-final-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: volcanic-lightning-nestoras-final-preview
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install media and Azure tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m pip install --disable-pip-version-check --no-input azure-cognitiveservices-speech requests pillow

      - name: Render strict Nestoras preview
        env:
          OUTPUT_DIR: ${{ runner.temp }}/finished
        run: |
          set -euo pipefail
          python3 tools/render_azure_feature_batch.py --manifest media_jobs/volcanic_lightning_final_preview.json --output "$OUTPUT_DIR"

      - name: Store QA-passed preview on media-output only
        env:
          OUTPUT_DIR: ${{ runner.temp }}/finished
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/media-output-repo"
          if git fetch origin media-output --depth=1; then
            git worktree add --detach "$OUT" FETCH_HEAD
          else
            git worktree add --detach "$OUT" "$GITHUB_SHA"
            git -C "$OUT" checkout --orphan media-output
            git -C "$OUT" rm -rf .
          fi
          DEST="$OUT/jobs/volcanic-lightning-nestoras-final-preview"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$OUTPUT_DIR/volcanic-lightning-nestoras-final-preview"/. "$DEST/"
          cp media_jobs/volcanic_lightning_final_preview.json "$DEST/source_manifest.json"
          git -C "$OUT" config user.name 'github-actions[bot]'
          git -C "$OUT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$OUT" add jobs/volcanic-lightning-nestoras-final-preview
          if ! git -C "$OUT" diff --cached --quiet; then
            git -C "$OUT" commit -m 'Render strict volcanic lightning Nestoras preview'
            git -C "$OUT" push origin HEAD:media-output
          fi
          cat "$DEST/qa.json" >> "$GITHUB_STEP_SUMMARY"
