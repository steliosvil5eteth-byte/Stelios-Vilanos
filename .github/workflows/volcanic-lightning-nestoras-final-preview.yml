name: Volcanic lightning Nestoras final preview

on:
  push:
    branches: [main]
    paths:
      - 'voice_demo/volcanic_lightning_final_preview.json'

permissions:
  contents: write

concurrency:
  group: volcanic-lightning-nestoras-final-preview
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil fonts-dejavu-core curl

      - name: Download licensed/public-domain volcanic-lightning photos
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/volcano/images"
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Taal%20Lightning%20Strike%20During%20Eruption.jpg" -o "$RUNNER_TEMP/volcano/images/01.jpg"
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Galunggung.jpg" -o "$RUNNER_TEMP/volcano/images/02.jpg"
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Rinjani%201994.jpg" -o "$RUNNER_TEMP/volcano/images/03.jpg"
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Eyjafjallaj%C3%B6kull%20by%20Terje%20S%C3%B8rgjerd.jpg" -o "$RUNNER_TEMP/volcano/images/04.jpg"
          for f in "$RUNNER_TEMP"/volcano/images/*; do ffprobe -v error "$f" >/dev/null; done

      - name: Synthesize Nestoras narration and build timed segments
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/volcano/audio"
          python3 - <<'PY'
          import json, subprocess, time
          from pathlib import Path
          from tools.azure_speech_tts import synthesize

          spec = json.loads(Path('voice_demo/volcanic_lightning_final_preview.json').read_text(encoding='utf-8'))
          assert spec['voice'] == 'el-GR-NestorasNeural'
          segments = [s.strip() for s in spec['segments'] if s.strip()]
          assert len(segments) >= 20
          out = Path(__import__('os').environ['RUNNER_TEMP'])/'volcano'
          rows=[]
          cursor=0.0
          policy=spec.get('tts_policy',{})
          max_attempts=int(policy.get('max_attempts',8))
          base_backoff=float(policy.get('initial_backoff_seconds',8))
          inter_delay=float(policy.get('inter_segment_delay_seconds',1.2))
          transient=('429','throttl','rate limit','too many requests','timeout','timed out','temporar','connection')

          for i,text in enumerate(segments,1):
              raw=out/'audio'/f'{i:02d}-raw.wav'
              clean=out/'audio'/f'{i:02d}.wav'
              for attempt in range(max_attempts):
                  try:
                      synthesize(text, raw, spec['voice'])
                      break
                  except Exception as exc:
                      msg=str(exc).lower()
                      raw.unlink(missing_ok=True)
                      if attempt+1>=max_attempts or not any(token in msg for token in transient):
                          raise
                      wait=min(45.0,base_backoff*(attempt+1))
                      print(f'Nestoras transient failure segment={i} attempt={attempt+1}/{max_attempts}; retry in {wait:.1f}s: {exc}',flush=True)
                      time.sleep(wait)
              subprocess.run([
                  'ffmpeg','-y','-loglevel','error','-i',str(raw),
                  '-af',
                  'silenceremove=start_periods=1:start_duration=0.02:start_threshold=-48dB,'
                  'areverse,'
                  'silenceremove=start_periods=1:start_duration=0.02:start_threshold=-48dB,'
                  'areverse',
                  '-ar','24000','-ac','1','-c:a','pcm_s16le',str(clean)
              ],check=True)
              raw.unlink(missing_ok=True)
              cp=subprocess.run([
                  'ffprobe','-v','error','-show_entries','format=duration',
                  '-of','default=noprint_wrappers=1:nokey=1',str(clean)
              ],check=True,text=True,capture_output=True)
              dur=float(cp.stdout.strip())
              rows.append({'i':i,'text':text,'start':cursor,'duration':dur,'end':cursor+dur})
              cursor += dur
              time.sleep(inter_delay)

          if cursor <= 80:
              raise SystemExit(f'Duration gate failed: {cursor:.3f}s must be >80s')
          (out/'timing.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'duration.txt').write_text(f'{cursor:.3f}\n',encoding='utf-8')
          print(f'total_seconds={cursor:.3f}')
          PY

      - name: Build photo-based vertical video with smaller safe-zone subtitles
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/volcano/clips"
          python3 - <<'PY'
          import json, math, os, subprocess
          from pathlib import Path

          root=Path(os.environ['RUNNER_TEMP'])/'volcano'
          rows=json.loads((root/'timing.json').read_text(encoding='utf-8'))
          concat=[]

          for row in rows:
              i=row['i']; dur=row['duration']; frames=max(1,math.ceil(dur*30))
              img=root/'images'/f'{((i-1)%4)+1:02d}.jpg'
              audio=root/'audio'/f'{i:02d}.wav'
              clip=root/'clips'/f'{i:02d}.mp4'
              if i % 2:
                  xexpr="iw/2-(iw/zoom/2)"
                  yexpr="ih/2-(ih/zoom/2)"
              else:
                  xexpr="iw/2-(iw/zoom/2)+20*sin(on/45)"
                  yexpr="ih/2-(ih/zoom/2)+15*cos(on/50)"
              vf=(
                  "scale=1300:2300:force_original_aspect_ratio=increase,"
                  "crop=1300:2300,"
                  f"zoompan=z='min(zoom+0.00045,1.08)':x='{xexpr}':y='{yexpr}':d={frames}:s=1080x1920:fps=30,"
                  "format=yuv420p"
              )
              subprocess.run([
                  'ffmpeg','-y','-loglevel','error','-loop','1','-i',str(img),'-i',str(audio),
                  '-vf',vf,'-t',f'{dur:.3f}',
                  '-c:v','libx264','-preset','veryfast','-crf','20',
                  '-c:a','aac','-b:a','128k','-shortest',str(clip)
              ],check=True)
              concat.append(f"file '{clip.as_posix()}'")

          (root/'concat.txt').write_text('\n'.join(concat)+'\n',encoding='utf-8')

          # ASS subtitles: small, max two lines, centered in mobile-safe lower area.
          def ass_time(sec):
              h=int(sec//3600); sec-=h*3600
              m=int(sec//60); s=sec-m*60
              return f"{h}:{m:02d}:{s:05.2f}"

          def split_half(text):
              words=text.split()
              if len(words)<=8: return [text]
              mid=len(words)//2
              return [' '.join(words[:mid]), ' '.join(words[mid:])]

          def wrap_two(text, width=32):
              words=text.split(); lines=[]; cur=''
              for w in words:
                  test=(cur+' '+w).strip()
                  if len(test)<=width or not cur:
                      cur=test
                  else:
                      lines.append(cur); cur=w
              if cur: lines.append(cur)
              if len(lines)>2:
                  # rebalance into exactly two lines
                  words=text.split(); mid=len(words)//2
                  lines=[' '.join(words[:mid]), ' '.join(words[mid:])]
              return r'\N'.join(lines[:2])

          head="""[Script Info]
ScriptType: v4.00+
PlayResX: 1080
PlayResY: 1920
WrapStyle: 2
ScaledBorderAndShadow: yes

[V4+ Styles]
Format: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding
Style: Main,DejaVu Sans,38,&H00FFFFFF,&H000000FF,&H00101010,&H8C000000,-1,0,0,0,100,100,0,0,1,3,0,2,120,120,300,1
Style: Hook,DejaVu Sans,43,&H00FFFFFF,&H000000FF,&H00000000,&H96000000,-1,0,0,0,100,100,0,0,1,4,0,2,110,110,300,1

[Events]
Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text
"""
          events=[]
          for idx,row in enumerate(rows):
              parts=split_half(row['text'])
              partdur=row['duration']/len(parts)
              for j,p in enumerate(parts):
                  st=row['start']+j*partdur
                  en=row['start']+(j+1)*partdur
                  style='Hook' if idx==0 else 'Main'
                  events.append(f"Dialogue: 0,{ass_time(st)},{ass_time(en)},{style},,0,0,0,,{wrap_two(p)}")
          (root/'subs.ass').write_text(head+'\n'.join(events)+'\n',encoding='utf-8')
          PY

          ffmpeg -y -loglevel error -f concat -safe 0 -i "$RUNNER_TEMP/volcano/concat.txt" -c copy "$RUNNER_TEMP/volcano/base.mp4"
          ffmpeg -y -loglevel error -i "$RUNNER_TEMP/volcano/base.mp4"             -vf "ass=$RUNNER_TEMP/volcano/subs.ass"             -c:v libx264 -preset medium -crf 19 -c:a copy             "$RUNNER_TEMP/volcano/volcanic-lightning-nestoras-v3.mp4"

      - name: Strict QA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'volcano'
          video=root/'volcanic-lightning-nestoras-v3.mp4'
          p=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nk=1:nw=1',str(video)],text=True,capture_output=True,check=True)
          dur=float(p.stdout.strip())
          streams=subprocess.run(['ffprobe','-v','error','-show_entries','stream=codec_type,width,height','-of','json',str(video)],text=True,capture_output=True,check=True)
          data=json.loads(streams.stdout)
          v=[s for s in data['streams'] if s['codec_type']=='video'][0]
          a=[s for s in data['streams'] if s['codec_type']=='audio']
          qa={
            'preview_only': True,
            'published': False,
            'voice':'el-GR-NestorasNeural',
            'duration_seconds':round(dur,3),
            'duration_gate_over_80s':dur>80,
            'resolution':f"{v.get('width')}x{v.get('height')}",
            'audio_streams':len(a),
            'photo_based_visuals':True,
            'photo_count':4,
            'burned_in_subtitles':True,
            'subtitle_font_size':38,
            'subtitle_max_lines':2,
            'subtitle_safe_zone':True,
            'background_music':False
          }
          if not (dur>80 and v.get('width')==1080 and v.get('height')==1920 and len(a)==1):
              raise SystemExit(f'QA failed: {qa}')
          (root/'qa.json').write_text(json.dumps(qa,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(qa,ensure_ascii=False,indent=2))
          PY

      - name: Publish preview file to media-output branch only
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/media-output-repo"
          if git fetch origin media-output --depth=1; then
            git worktree add --detach "$OUT" FETCH_HEAD
          else
            git worktree add --detach "$OUT" "$GITHUB_SHA"
            git -C "$OUT" checkout --orphan media-output
            git -C "$OUT" rm -rf .
          fi
          DEST="$OUT/jobs/volcanic-lightning-nestoras-preview-v3"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP/volcano/volcanic-lightning-nestoras-v3.mp4" "$DEST/"
          cp "$RUNNER_TEMP/volcano/qa.json" "$DEST/"
          cp "$RUNNER_TEMP/volcano/subs.ass" "$DEST/"
          cat > "$DEST/CREDITS.txt" <<'EOF'
Taal Volcano lightning photo: etrhamjr, CC BY-SA 4.0, Wikimedia Commons. Source: https://commons.wikimedia.org/wiki/File:Taal_Lightning_Strike_During_Eruption.jpg
Galunggung 1982 lightning photo: R. Hadian / USGS/NOAA, Public Domain. Source: https://commons.wikimedia.org/wiki/File:Galunggung.jpg
Mount Rinjani 1994 lightning photo: Oliver Spalt, CC BY 2.0, Wikimedia Commons. Source: https://commons.wikimedia.org/wiki/File:Rinjani_1994.jpg
Eyjafjallajökull 2010 eruption photo: Terje Sørgjerd, CC BY-SA 3.0, Wikimedia Commons. Source: https://commons.wikimedia.org/wiki/File:Eyjafjallajökull_by_Terje_Sørgjerd.jpg
All crops/reframes are production changes; attribution and applicable share-alike terms are preserved.
No social publishing performed by this workflow.
EOF
          git -C "$OUT" config user.name 'github-actions[bot]'
          git -C "$OUT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$OUT" add jobs/volcanic-lightning-nestoras-preview-v3
          if ! git -C "$OUT" diff --cached --quiet; then
            git -C "$OUT" commit -m "Render volcanic lightning Nestoras review preview v3"
            git -C "$OUT" push origin HEAD:media-output
          fi
