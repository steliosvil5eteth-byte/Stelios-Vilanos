name: Azure Nestoras Voice Demo

on:
  push:
    branches: [main]
    paths:
      - 'voice_demo/nestoras_demo.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Generate Nestoras audio
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nestoras"
          python tools/azure_nestoras_demo.py voice_demo/nestoras_demo.txt "$RUNNER_TEMP/nestoras/nestoras.wav"
          ffmpeg -v error -i "$RUNNER_TEMP/nestoras/nestoras.wav" -f null -
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "$RUNNER_TEMP/nestoras/nestoras.wav" > "$RUNNER_TEMP/nestoras/duration.txt"

      - name: Build preview video
        run: |
          set -euo pipefail
          DUR=$(cat "$RUNNER_TEMP/nestoras/duration.txt")
          ffmpeg -y -v error -f lavfi -i "color=c=0x101820:s=1080x1920:r=25:d=$DUR" -i "$RUNNER_TEMP/nestoras/nestoras.wav" -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='NESTORAS NEURAL':fontcolor=white:fontsize=70:x=(w-text_w)/2:y=760,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Azure Speech F0 - Greek male voice':fontcolor=white:fontsize=38:x=(w-text_w)/2:y=860" -map 0:v -map 1:a -shortest -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart "$RUNNER_TEMP/nestoras/nestoras-demo.mp4"

      - name: Upload Nestoras demo
        uses: actions/upload-artifact@v4
        with:
          name: nestoras-azure-demo
          path: |
            ${{ runner.temp }}/nestoras/nestoras-demo.mp4
            ${{ runner.temp }}/nestoras/nestoras.wav
            ${{ runner.temp }}/nestoras/duration.txt
          retention-days: 7
